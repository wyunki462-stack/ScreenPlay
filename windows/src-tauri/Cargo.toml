[package]
name = "screenplay"
# 桌面端自己的版号线（windows/package.json 为准）：1.3.1 这类「仅 Windows 端修复」的
# 版本只在这里前进，根 / backend / web 的版号与 Linux/Docker 发布线保持一致。
# 这个值会写进 exe 的 PE 版本资源（文件属性里看到的「文件版本/产品版本」）。
version = "1.3.1"
description = "ScreenPlay desktop shell (Tauri v2) — hosts the bundled NestJS backend and shows the Web UI 1:1."
authors = ["ScreenPlay"]
edition = "2021"
# Verified against the real crate sources: tauri 2.12.0 (the version `version = "2"`
# resolves to) is `edition = "2024"` with `rust-version = "1.90"`, so a build needs
# rustc >= 1.90. Declaring it here also makes cargo's MSRV-aware resolver pick
# dependency versions that a 1.90 toolchain can actually compile.
rust-version = "1.90"
license = "MIT"

# No `[lib]` section on purpose: an empty `[lib]` table declares a library target
# and makes cargo look for a `src/lib.rs` that does not exist. Tauri only needs a
# lib target for mobile; this shell is a plain binary.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Deliberately minimal: no reqwest/hyper/tokio/openssl.
#  - health check is hand-written on std::net::TcpStream
#  - child process handling is std::process + std::thread
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# No `panic = "abort"`: a panic on the health-poll thread must not take the whole
# shell down with it.

[features]
# No custom features. Tauri's defaults are enough for a single-window shell.
default = []