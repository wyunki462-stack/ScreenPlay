<html lang="en">

        "@context": "https://schema.org",

      <span data-testid="metascore">92</span>
      <span class="c-site-review-score__count">78 Critic Reviews</span>
      <script type="application/json">{"metaScore":{"score":92,"reviewCount":78}}</script>
