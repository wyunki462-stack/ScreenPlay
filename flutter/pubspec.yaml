# ScreenPlay Flutter 客户端 —— 安卓端 1.3.2
# 1.3.1 为安卓端补齐「核心 / 基础设施层」：本地偏好、网络类型判断、图片三级缓存、
# 媒体分享/保存/删除、前后台降级、会话凭证（Bearer + Cookie 双通道）。
# 1.3.2+3（versionCode 3）修三项交互：①卡片海报区 16:9，与 Web 端 `aspect-video` 一致；
# ②自定义拖拽排序「松手即生效」并持久化；③卡片轮播与 Web / Linux 端同步、支持左右滑动切图。
# 详见 flutter/docs/ANDROID-1.3.2.md。
name: screenplay
description: "ScreenPlay — 个人游戏媒体图库管理器（Flutter 客户端）。纯客户端：所有数据来自后端 HTTP API。"
publish_to: 'none'
version: 1.3.3+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1

  # HTTP 客户端
  dio: ^5.7.0

  # 图片网络加载与缓存（海报 / 截图 / 封面）
  cached_network_image: ^3.4.1

  # 视频播放：官方 video_player + chewie UI 层
  # （为什么不用 better_player：见 README「视频插件选择」一节）
  video_player: ^2.9.0
  chewie: ^1.8.0

  # 瀑布流 / 交错网格（媒体网格中图片与视频混合排布）
  flutter_staggered_grid_view: ^0.7.0

  # 数字 / 日期格式化
  intl: ^0.19.0

  # 服务器地址本地持久化（运行时设置屏幕）
  shared_preferences: ^2.3.2

  # ↓↓↓ 安卓端 1.3.1 新增：核心层依赖 ↓↓↓
  # 网络类型判断（WiFi/以太网 → 原图；移动数据 → 预览图）
  connectivity_plus: ^6.0.5
  # 分享到 QQ / 微信（调起系统分享面板，由系统提供目标应用）
  share_plus: ^10.1.2
  # 临时文件目录与缓存目录（下载中转、缓存容量统计）
  path_provider: ^2.1.5
  # 保存到系统相册（Android 10+ 走 MediaStore）
  gal: ^2.3.1
  # 图片三级缓存（内存 Flutter ImageCache + 磁盘 flutter_cache_manager + 网络）
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true