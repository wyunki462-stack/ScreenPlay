name: Docker Build and Push

# 触发规则：什么时候自动执行构建
on:
  push:
    branches: [ "main" ]       # 推送到 main 分支时触发
    tags: [ 'v*.*.*' ]         # 打版本标签（如v1.0.0）时触发
  pull_request:
    branches: [ "main" ]       # PR提交时只构建不推送，用于验证代码

# 权限配置：允许推送镜像到 GHCR
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

# 优化：取消同分支正在运行的重复任务，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest     # 运行环境：最新版Ubuntu

    steps:
      # 1. 拉取你仓库里的代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置 Docker Buildx（支持多架构构建+缓存加速）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 自动登录 GHCR 镜像仓库
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ shturl.cc/43 }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 自动生成镜像标签（latest/版本号/commit哈希）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      # 5. 构建镜像并推送到 GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .                    # Docker构建上下文（根目录）
          push: ${{ github.event_name != 'pull_request' }}  # PR不推送，其余推送
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha          # 开启构建缓存，大幅加快后续构建速度
          cache-to: type=gha,mode=max
